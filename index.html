<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbittroniz</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;min-height:100dvh;background:#020412;overflow:hidden;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% -10%, #1e3a8a 0%, #0f1a4a 25%, #020412 70%)}
.stars{position:fixed;inset:0;opacity:0.6;background-image:radial-gradient(1px 1px at 20% 30%, #3b82f6, transparent),radial-gradient(1.5px 1.5px at 80% 20%, #60a5fa, transparent),radial-gradient(1px 1px at 40% 70%, #6366f1, transparent),radial-gradient(1px 1px at 60% 80%, #38bdf8, transparent)}

/* SCENE */
.scene{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center}
.orb-wrap{position:relative;width:280px;height:280px;animation:floatMain 6s ease-in-out infinite}
@keyframes floatMain{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

/* SPHERE - COLOR SHIFTING */
.sphere{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), rgba(96,165,250,0.2) 20%, rgba(30,58,138,0.5) 60%, rgba(2,4,18,0.9) 90%);border:1px solid rgba(147,197,253,0.25);box-shadow:inset -20px -20px 40px rgba(0,0,0,0.8), 0 0 80px rgba(59,130,246,0.5), 0 0 120px rgba(99,102,241,0.2);animation:sphereGlow 4s ease-in-out infinite}
@keyframes sphereGlow{0%,100%{box-shadow:inset -20px -20px 40px rgba(0,0,0,0.8), 0 0 80px rgba(59,130,246,0.5)}50%{box-shadow:inset -20px -20px 40px rgba(0,0,0,0.8), 0 0 100px rgba(168,85,247,0.6), 0 0 140px rgba(59,130,246,0.3)}}

/* RINGS - COLOR CHANGING */
.ring{position:absolute;top:50%;left:50%;width:145%;height:34%;border-radius:50%;border-top:2.5px solid #60a5fa;border-bottom:1px solid rgba(251,146,60,0.4);transform:translate(-50%,-50%) rotateX(75deg) rotateZ(-15deg);box-shadow:0 0 20px currentColor;animation:ringRotate 8s linear infinite, ringColor 6s ease-in-out infinite}
.ring2{width:155%;height:38%;animation-duration:12s, 6s;animation-delay:0s, 1s;opacity:0.7}
@keyframes ringRotate{to{transform:translate(-50%,-50%) rotateX(75deg) rotateZ(360deg)}}
@keyframes ringColor{0%{border-top-color:#60a5fa;color:#60a5fa}33%{border-top-color:#a78bfa;color:#a78bfa}66%{border-top-color:#38bdf8;color:#38bdf8}100%{border-top-color:#60a5fa;color:#60a5fa}}

/* CHIP - INNOVATION LOGO */
.chip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:92px;height:92px;background:linear-gradient(135deg, #0f172a, #1e293b);border:1px solid rgba(59,130,246,0.5);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(59,130,246,0.6), inset 0 1px 0 rgba(255,255,255,0.15);animation:chipPulse 2s ease-in-out infinite;overflow:hidden}
@keyframes chipPulse{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 30px rgba(59,130,246,0.6)}50%{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 0 45px rgba(168,85,247,0.7)}}

/* SCAN LINE */
.chip::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg, transparent, #38bdf8, transparent);animation:scan 2.5s linear infinite;opacity:0.8}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(92px)}}

/* O LETTER - COLOR CHANGING + BLINK */
.chip b{font-size:36px;font-weight:800;animation:colorShift 5s ease-in-out infinite, blink 4s ease-in-out infinite;position:relative;z-index:2}
@keyframes colorShift{0%{color:#38bdf8;text-shadow:0 0 15px #38bdf8}25%{color:#a78bfa;text-shadow:0 0 15px #a78bfa}50%{color:#60a5fa;text-shadow:0 0 15px #60a5fa}75%{color:#f472b6;text-shadow:0 0 15px #f472b6}100%{color:#38bdf8;text-shadow:0 0 15px #38bdf8}}
@
