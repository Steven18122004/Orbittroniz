
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05081a;color:#fff;font-family:sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* 3D LIVE AI BACKGROUND */
canvas#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
.top{flex:1;position:relative;z-index:2;display:flex;align-items:center;justify-content:center}

/* 2 ROTATING ORBITS */
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(120,140,255,0.15)}
.orbit1{width:320px;height:320px;animation:rot1 12s linear infinite}
.orbit2{width:460px;height:460px;border:1px dashed rgba(100,120,200,0.18);animation:rot2 20s linear infinite reverse}
@keyframes rot1{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes rot2{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
.orbit::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;background:#8b9cff;border-radius:50%;box-shadow:0 0 10px #8b9cff}

/* LOGO CARD - FLOATING */
.card{width:120px;height:120px;background:rgba(21,30,60,0.9);backdrop-filter:blur(10px);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;border:1px solid rgba(255,255,255,0.08);box-shadow:0 0 40px rgba(90,110,255,0.3);animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* O - BLINKING DIFFERENT COLOURS GLOW */
.o-ring{width:46px;height:46px;border-radius:50%;border:3.5px solid #a78bfa;animation:colorBlink 3s ease-in-out infinite}
@keyframes colorBlink{
  0%{border-color:#a78bfa;box-shadow:0 0 15px #a78bfa, 0 0 30px #a78bfa66}
  25%{border-color:#60a5fa;box-shadow:0 0 15px #60a5fa, 0 0 30px #60a5fa66}
  50%{border-color:#34d399;box-shadow:0 0 15px #34d399, 0 0 30px #34d39966}
  75%{border-color:#f472b6;box-shadow:0 0 15px #f472b6, 0 0 30px #f472b666}
  100%{border-color:#a78bfa;box-shadow:0 0 15px #a78bfa, 0 0 30px #a78bfa66}
}
.card-text{margin-top:14px;font-size:9.5px;letter-spacing:3px;color:#a9c1ff;font-weight:700}

/* BOTTOM - LOGOUT ALWAYS VISIBLE */
.bottom{background:rgba(17,26,51,0.95);backdrop-filter:blur(20px);padding:24px 20px 36px 20px;border-radius:30px 30px 0 0;text-align:center;z-index:10;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06)}
.bottom h1{font-size:32px;font-weight:800}
.email{color:#8a94ad;font-size:14px;margin-top:4px;display:block}
.ok{color:#4ade80;margin:16px 0 20px 0;font-weight:600}
.logout{width:100%;padding:17px;background:linear-gradient(90deg,#6366f1,#8b5cf6);border:none;border-radius:14px;color:white;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(99,102,241,0.4)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top">
  <div class="orbit orbit1"></div>
  <div class="orbit orbit2"></div>
  <div class="card">
    <div class="o-ring"></div>
    <div class="card-text">ORBITTRONIZ</div>
  </div>
</div>
<div class="bottom">
  <h1>Welcome 👋</h1>
  <span class="email">stevenalphanso1812@gmail.com</span>
  <div class="ok">✅ Login Successful</div>
  <button class="logout" onclick="localStorage.clear();location.reload()">Logout</button>
</div>

<script>
// 3D PARTICLE AI BACKGROUND - Attracts customer
const c=document.getElementById('bg'),x=c.getContext('2d');
let w,h,particles=[];
function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
for(let i=0;i<60;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.6,vy:(Math.random()-0.5)*0.6,r:Math.random()*1.5+0.5});
function anim(){
  x.clearRect(0,0,w,h);
  x.fillStyle='rgba(90,110,255,0.04)';
  x.fillRect(0,0,w,h);
  particles.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;
    x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle='rgba(140,160,255,0.6)';x.fill();
    particles.forEach((p2,j)=>{
      if(i>=j)return;
      let dx=p.x-p2.x,dy=p.y-p2.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p2.x,p2.y);x.strokeStyle='rgba(100,120,200,'+(0.15-d/800)+')';x.stroke()}
    });
  });
  requestAnimationFrame(anim);
}
anim();
</script>
</body>
</html>
