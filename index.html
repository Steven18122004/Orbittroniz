
<!DOCTYPE html>

  </div>
</div>
<div class="bottom-sheet">
  <h1 style="margin:0;">Welcome 👋</h1>
  <small style="color:#9ca3af;">stevenalphanso1812@gmail.com</small>
  <p style="color:#4ade80; margin:15px 0;">✅ Login Successful</p>

function logout(){ localStorage.clear(); location.reload(); }
