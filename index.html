<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz - AI Image & Logo Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,#2a2a5e 0%,#1a1a40 40%,#0f0f2e 100%),linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:32px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,0.4)}
h1{font-size:32px;text-align:center;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.sub{color:#cbd5e1;text-align:center;font-size:14px;margin:10px 0 28px}
.tabs{display:flex;gap:6px;margin-bottom:22px;background:rgba(0,0,0,0.35);padding:5px;border-radius:14px}
.tab{flex:1;padding:12px;text-align:center;border-radius:10px;cursor:pointer;color:#94a3b8;font-size:14px;font-weight:500;transition:0.25s}
.tab.active{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;box-shadow:0 4px 15px rgba(59,130,246,0.3)}
input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:15px 16px;margin-bottom:14px;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#60a5fa}
button{width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:12px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:12px;box-shadow:0 8px 20px rgba(59,130,246,0.25)}
button.sec{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);box-shadow:none}
#msg{text-align:center;font-size:13px;min-height:20px;margin-top:10px}
.error{color:#fca5a5} .success{color:#86efac}
#dashCard{display:none;text-align:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.tool{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);padding:20px;border-radius:16px;color:#e2e8f0;font-size:14px}
</style>
</head>
<body>
<div class="card" id="authCard">
<h1>Orbittroniz</h1>
<p class="sub">AI Image & Logo Generator</p>
<div class="tabs">
<div class="tab" id="tabLogin" onclick="setMode('login')">Login</div>
<div class="tab active" id="tabSignup" onclick="setMode('signup')">Sign Up</div>
</div>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (min 6 chars)">
<button id="mainBtn" onclick="handleAuth()">Create Account</button>
<button
