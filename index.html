
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#050a18;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh; display:flex; flex-direction:column;
    overflow:hidden; color:white;
  }
  /* CENTER ORBIT LOGO - From 2nd Image */
  .center-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative;
    background: radial-gradient(ellipse at center, #16214a 0%, #0a1228 40%, #050a18 70%);
  }
  .orbit-big{
    width:340px; height:340px; border-radius:50%;
    border:1px solid rgba(120,140,255,0.12);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background: radial-gradient(circle at center, rgba(60,90,200,0.18) 0%, rgba(10,20,50,0.1) 60%, transparent 70%);
  }
  .orbit-big::before{
    content:""; position:absolute; width:120%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(150,180,255,0.4), transparent);
    top:50%; left:-10%; transform:rotate(-8deg);
    box-shadow:0 0 10px rgba(120,160,255,0.3);
  }
  .logo-card{
    width:115px; height:115px; background:#0f1a32;
    border-radius:20px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    border:1px solid rgba(100,130,255,0.15);
    box-shadow:0 0 30px rgba(80,120,255,0.25), 0 0 60px rgba(40,60,150,0.15);
    position:relative; z-index:2;
  }
  .logo-circle{
    width:42px; height:42px; border-radius:50%;
    background:radial-gradient(circle, #7aa8ff 0%, #4a7bff 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 15px #6a8cff, inset 0 0 10px rgba(255,255,255,0.4);
  }
  .logo-circle::after{
    content:""; width:18px; height:18px; background:#0f1a32; border-radius:50%;
  }
  .logo-text{
    margin-top:14px; font-size:9px; letter-spacing:2.8px;
    color:#9ab4ff; font-weight:700;
  }
  .dot-green{
    position:absolute; top:10px; right:10px; width:8px; height:8px;
    background:#22c55e; border-radius:50%; box-shadow:0 0 8px #22c55e;
  }

  /* BOTTOM SHEET - Fixed to show logout fully */
  .sheet{
    background:#10182f; border-radius:28px 28px 0 0;
    padding:24px 20px 34px 20px; text-align:center;
    border-top:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  .sheet h1{ font-size:32px; font-weight:800; letter-spacing:-0.5px; }
  .sheet .email{ color:#8892b0; font-size:14px; margin-top:4px; display:block; }
  .success{ color:#4ade80; margin:18px 0 20px 0; font-weight:600; font-size:16px; }
  .logout-btn{
    width:100%; background:linear-gradient(90deg, #6366f1, #8b5cf6);
    color:white; border:none; padding:17px; border-radius:14px;
    font-size:16px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 20px rgba(99,102,241,0.35);
  }
</style>
</head>
<body>

<div class="center-wrap">
  <div class="orbit-big">
    <div class="logo-card">
      <div class="dot-green"></div>
      <div class="logo-circle"></div>
      <span class="logo-text">ORBITTRONIZ</span>
    </div>
  </div>
</div>

<div class="sheet">
  <h1>Welcome 👋</h1>
  <span class="email">stevenalphanso1812@gmail.com</span>
  <div class="success">✅ Login Successful</div>
  <button class="logout-btn" onclick="localStorage.clear(); location.reload();">Logout</button>
</div>

</body>
</html>
