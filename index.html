
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070b1c;color:#fff;font-family:sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* TOP WITH LIVE MOTION */
.top{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#070b1c;overflow:hidden}
.big-circle{width:340px;height:340px;border-radius:50%;border:1px solid rgba(100,110,180,0.12);position:absolute;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.05);opacity:1}}

.orbit-wrap{position:absolute;width:150%;height:150%;animation:rotate 20s linear infinite}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.orbit-line{position:absolute;width:100%;height:1px;background:linear-gradient(90deg, transparent, rgba(170,190,255,0.5), transparent);top:50%;left:0}

/* LOGO - CLEAN O NO GLOW - LIKE 1ST IMAGE */
.card{width:112px;height:112px;background:#151e36;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;box-shadow:0 8px 32px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.05);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.o-ring{width:42px;height:42px;border-radius:50%;border:3px solid #a78bfa; /* clean purple outline - no glow fill */animation:ringPulse 2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{border-color:#a78bfa;transform:scale(1)}50%{border-color:#c4b5fd;transform:scale(1.08)}}

.card-text{margin-top:14px;font-size:9px;letter-spacing:3px;color:#8ab4ff;font-weight:600}

/* BOTTOM - LOGOUT FULLY VISIBLE */
.bottom{background:#111a33;padding:24px 20px 32px 20px;border-radius:30px 30px 0 0;text-align:center;flex-shrink:0}
.bottom h1{font-size:32px;font-weight:800}
.email{color:#8a94ad;font-size:14px;margin-top:4px;display:block}
.ok{color:#4ade80;margin:16px 0 20px 0;font-weight:600}
.logout{width:100%;padding:17px;background:linear-gradient(90deg,#6366f1,#8b5cf6);border:none;border-radius:14px;color:white;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="top">
  <div class="big-circle"></div>
  <div class="orbit-wrap"><div class="orbit-line"></div></div>
  <div class="card">
    <div class="o-ring"></div>
    <div class="card-text">ORBITTRONIZ</div>
  </div>
</div>
<div class="bottom">
  <h1>Welcome 👋</h1>
  <span class="email">stevenalphanso1812@gmail.com</span>
  <div class="ok">✅ Login Successful</div>
  <button class="logout" onclick="localStorage.clear();location.reload()">Logout</button>
</div>
</body>
</html>
