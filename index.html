
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#fff;font-family:sans-serif;position:relative;background:#02050f}

/* YOUR NEW AI BACKGROUND WITH MOTION */
.bg-img{position:absolute;inset:0;background:url('bg.jpg') center/cover no-repeat;z-index:0;animation:zoomBg 12s ease-in-out infinite alternate;filter:brightness(0.55)}
@keyframes zoomBg{0%{transform:scale(1)}100%{transform:scale(1.1)}}
.overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(5,10,30,0.2) 0%, rgba(2,5,15,0.85) 80%);z-index:1}

/* CENTER LOGO WITH MOTION */
.top{flex:1;position:relative;z-index:5;display:flex;align-items:center;justify-content:center}
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(130,150,255,0.25)}
.orbit1{width:300px;height:300px;animation:spin 8s linear infinite}
.orbit2{width:430px;height:430px;border-style:dashed;animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;background:#8ab4ff;border-radius:50%;box-shadow:0 0 12px #8ab4ff}

.card{width:118px;height:118px;background:rgba(15,23,50,0.85);backdrop-filter:blur(12px);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.1);box-shadow:0 0 35px rgba(80,110,255,0.4);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.o-ring{width:44px;height:44px;border-radius:50%;border:3px solid #a78bfa;animation:blink 2.5s infinite}
@keyframes blink{0%{border-color:#a78bfa;box-shadow:0 0 12px #a78bfa}25%{border-color:#60a5fa;box-shadow:0 0 15px #60a5fa}50%{border-color:#34d399;box-shadow:0 0 15px #34d399}75%{border-color:#f472b6;box-shadow:0 0 15px #f472b6}100%{border-color:#a78bfa;box-shadow:0 0 12px #a78bfa}}
.txt{margin-top:12px;font-size:9px;letter-spacing:3px;color:#a8c4ff;font-weight:700}

/* BOTTOM - LOGOUT VISIBLE */
.bottom{background:rgba(14,23,49,0.92);backdrop-filter:blur(20px);padding:24px 20px 38px 20px;border-radius:28px 28px 0 0;text-align:center;z-index:10;flex-shrink:0}
.bottom h1{font-size:32px;font-weight:800}
.email{color:#8e9ab3;font-size:13px;display:block;margin-top:3px}
.ok{color:#4ade80;margin:16px 0 20px 0;font-weight:600}
.logout{width:100%;padding:17px;background:linear-gradient(90deg,#6366f1,#8b5cf6);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="bg-img"></div>
<div class="overlay"></div>
<div class="top">
  <div class="orbit orbit1"></div>
  <div class="orbit orbit2"></div>
  <div class="card">
    <div class="o-ring"></div>
    <div class="txt">ORBITTRONIZ</div>
  </div>
</div>
<div class="bottom">
  <h1>Welcome 👋</h1>
  <span class="email">stevenalphanso1812@gmail.com</span>
  <div class="ok">✅ Login Successful</div>
  <button class="logout" onclick="localStorage.clear();location.reload()">Logout</button>
</div>
</body>
</html>
