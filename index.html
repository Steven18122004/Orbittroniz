<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz</title>
<style>
  body {
    margin:0; background:#050a18; color:white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height:100vh; display:flex; flex-direction:column;
    overflow:hidden;
  }
  .center {
    flex:1; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at center, #1e2a4a 0%, #050a18 70%);
  }
  .logo {
    background:#101a33; width:130px; height:130px;
    border-radius:24px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    border:1px solid #2a3a5a; box-shadow:0 0 60px #3b82f633;
  }
  .logo-circle {
    width:36px; height:36px; border:4px solid #8b9cff;
    border-radius:50%; box-shadow:0 0 15px #8b9cff;
  }
  .sheet {
    background:#0f172a; border-radius:32px 32px 0 0;
    padding:28px 24px; text-align:center;
  }
  .sheet h1 { margin:0; font-size:32px; font-weight:800; }
  .sheet small { color:#94a3b8; }
  .success { color:#4ade80; margin:18px 0; font-weight:600; }
  .logout {
    width:100%; background:linear-gradient(90deg, #6366f1, #8b5cf6);
    color:white; border:none; padding:16px; border-radius:14px;
    font-size:16px; font-weight:700;
  }
</style>
</head>
<body>
<div class="center">
  <div class="logo">
    <div class="logo-circle"></div>
    <span style="margin-top:12px; font-size:10px; letter-spacing:3px; color:#93c5fd; font-weight:700;">ORBITTRONIZ</span>
  </div>
</div>

<div class="sheet">
  <h1>Welcome 👋</h1>
  <small>stevenalphanso1812@gmail.com</small>
  <div class="success">✅ Login Successful</div>
  <button class="logout" onclick="localStorage.clear(); location.reload();">Logout</button>
</div>
</body>
</html>
