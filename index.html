
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz - AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui}
body{
min-height:100vh;
background: radial-gradient(ellipse at top, #1e3a8a 0%, #0a0e27 50%, #020412 100%);
display:flex;align-items:center;justify-content:center;
padding:20px;overflow:hidden;position:relative;
}
body::before{
content:'';position:absolute;width:800px;height:800px;
background:radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
top:-200px;left:-200px;animation: float 6s ease-in-out infinite;
}
body::after{
content:'';position:absolute;width:600px;height:600px;
background:radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
bottom:-100px;right:-100px;animation: float 8s ease-in-out infinite reverse;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.grid{
position:absolute;inset:0;
background-image: 
linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
background-size:50px 50px;
}
.card{
position:relative;z-index:2;
width:100%;max-width:420px;
background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
backdrop-filter: blur(30px);
border:1px solid rgba(100,149,255,0.15);
border-radius:28px;
padding:36px 28px;
box-shadow: 
0 20px 60px rgba(0,0,0,0.5),
0 0 0 1px rgba(59,130,246,0.1) inset,
0 0 100px rgba(59,130,246,0.08);
}
.logo{
width:64px;height:64px;margin:0 auto 16px;
background: linear-gradient(135deg, #3b82f6, #6366f1, #8b5cf6);
border-radius:18px;
display:flex;align-items:center;justify-content:center;
font-size:28px;
box-shadow: 0 8px 24px rgba(59,130,246,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
}
h1{
font-size:32px;font-weight:800;text-align:center;
background: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa);
background-size:200% auto;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation: shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.sub{color:#94a3b8;text-align:center;font-size:14px;margin:8px 0 28px;letter-spacing:0.3px}
.tabs{
display:flex;gap:6px;background:rgba(0,0,0,0.4);
border:1px solid rgba(255,255,255,0.06);
padding:5px;border-radius:14px;margin-bottom:24px;
}
.tab{
flex:1;padding:11px;text-align:center;border-radius:10px;
font-size:13px;font-weight:600;color:#64748b;cursor:pointer;transition:0.3s;
}
.tab.active{
background: linear-gradient(90deg, #3b82f6, #6366f1);
color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.4);
}
.input-group{position:relative;margin-bottom:14px}
.input-group input{
width:100%;background:rgba(0,0,0,0.4);
border:1px solid rgba(100,149,255,0.12);
border-radius:14px;padding:14px 16px 14px 44px;
color:#fff;font-size:14px;outline:none;transition:0.3s;
}
.input-group input::placeholder{color:#475569}
.input-group input:focus{
border-color: rgba(59,130,246,0.5);
box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
background:rgba(0,0,0,0.5);
}
.input-group .icon{
position:absolute;left:14px;top:50%;transform:translateY(-50%);
font-size:16px;opacity:0.6;
}
.btn{
width:100%;background: linear-gradient(90deg, #3b82f6, #6366f1);
border:none;border-radius:14px;padding:14px;
color:#fff;font-weight:700;font-size:14px;cursor:pointer;
margin-top:6px;transition:0.3s;
box-shadow: 0 8px 20px rgba(59,130,246,0.35);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(59,130,246,0.45)}
.btn:active{transform:translateY(0)}
.msg{min-height:20px;text-align:center;font-size:13px;margin-top:14px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}
.divider span{color:#475569;font-size:11px;letter-spacing:1px}
.badge{
display:inline-flex;align-items:center;gap:6px;
background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);
padding:6px 12px;border-radius:20px;font-size:11px;color:#60a5fa;
margin:0 auto 20px;display:flex;width:fit-content;
}
</style>
</head>
<body>
<div class="grid"></div>

<div class="card" id="aBox">
<div class="badge">✨ AI-Powered Studio</div>
<div class="logo">◉</div>
<h1>Orbittroniz</h1>
<p class="sub">Sign in to your AI creative universe</p>

<div class="tabs">
<div class="tab" id="tL" onclick="switchMode('login')">Login</div>
<div class="tab active" id="tS" onclick="switchMode('signup')">Sign Up</div>
</div>

<div class="input-group">
<span class="icon">✉️</span>
<input id="email" type="email" placeholder="Email address">
</div>

<div class="input-group">
<span class="icon">🔒</span>
<input id="pass" type="password" placeholder="Password (min 6 characters)">
</div>

<button class="btn" id="mainBtn" onclick="handleAuth()">Create Account →</button>

<div class="msg" id="msg"></div>

<div class="divider"><span>SECURE & FAST</span></div>
<p style="text-align:center;color:#334155;font-size:11px;">Trusted by creators • No watermark • Blue AI Theme</p>
</div>

<div class="card hide" id="dBox" style="display:none;text-align:center">
<div class="logo">✓</div>
<h1 style="font-size:28px">Welcome!</h1>
<p class="sub" id="userEmail"></p>
<p style="color:#22c55e;font-size:14px;margin:12px 0">✅ Login Successful</p>
<p style="color:#64748b;font-size:13px;margin-bottom:20px">Your Orbittroniz workspace is ready. Premium tools coming soon.</p>
<button class="btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);box-shadow:none" onclick="logout()">Logout</button>
</div>

<script>
var mode = 'signup';

function switchMode(m){
 mode = m;
 document.getElementById('tL').className = m=='login' ? 'tab active' : 'tab';
 document.getElementById('tS').className = m=='signup' ? 'tab active' : 'tab';
 document.getElementById('mainBtn').innerText = m=='login' ? 'Login →' : 'Create Account →';
 document.getElementById('msg').innerText = '';
}

function handleAuth(){
 var e = document.getElementById('email').value.trim();
 var p = document.getElementById('pass').value;
 var msg = document.getElementById('msg');

 if(e.indexOf('@') === -1 || e.length < 5){
   msg.innerHTML = '<span style="color:#f87171">Please enter valid email</span>'; return;
 }
 if(p.length < 6){
   msg.innerHTML = '<span style="color:#f87171">Password must be 6+ characters</span>'; return;
 }

 if(mode === 'signup'){
   localStorage.setItem('orbittroniz_user', JSON.stringify({email:e, pass:p}));
   msg.innerHTML = '<span style="color:#4ade80">✓ Account created! Loading...</span>';
   setTimeout(function(){ showDashboard(e); }, 600);
 } else {
   var saved = null;
   try{ saved = JSON.parse(localStorage.getItem('orbittroniz_user') || 'null'); }catch(err){}
   if(saved && saved.email === e && saved.pass === p){
     showDashboard(e);
   } else {
     msg.innerHTML = '<span style="color:#f87171">Wrong email/password or please Sign Up first</span>';
   }
 }
}

function showDashboard(email){
 document.getElementById('aBox').style.display = 'none';
 var d = document.getElementById('dBox');
 d.style.display = 'block';
 d.classList.remove('hide');
 document.getElementById('userEmail').innerText = email;
 localStorage.setItem('orbittroniz_login', email);
}

function logout(){
 localStorage.removeItem('orbittroniz_login');
 location.reload();
}

// Auto login if already logged in
(function(){
 try{
   var logged = localStorage.getItem('orbittroniz_login');
   if(logged){ showDashboard(logged); }
 }catch(e){}
})();

// Extra safety: Enter key works
document.getElementById('pass').addEventListener('keypress', function(e){ if(e.key==='Enter'){ handleAuth(); }});
document.getElementById('email').addEventListener('keypress', function(e){ if(e.key==='Enter'){ handleAuth(); }});
</script>
</body>
</html>
