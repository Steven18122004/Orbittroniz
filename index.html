
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbittroniz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{min-height:100vh;background:radial-gradient(ellipse at top, #1e3a8a 0%, #0a0e27 55%, #020412 100%);display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);top:-150px;left:-150px;animation:float 6s infinite}
body::after{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);bottom:-100px;right:-100px;animation:float 8s infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);background-size:50px 50px}
.c{position:relative;z-index:2;background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));backdrop-filter:blur(30px);border:1px solid rgba(100,149,255,0.15);border-radius:28px;padding:32px 26px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 100px rgba(59,130,246,0.08)}
.c.w{max-width:900px}
.logo-img{width:92px;height:92px;margin:0 auto 12px;border-radius:22px;box-shadow:0 8px 24px rgba(59,130,246,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;object-fit:cover}
h1{font-size:32px;font-weight:900;background:linear-gradient(90deg, #60a5fa, #a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.s{color:#94a3b8;font-size:13px;margin:8px 0 20px}
.t{display:flex;gap:6px;background:rgba(0,0,0,0.4);padding:5px;border-radius:14px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.06)}
.tb{flex:1;padding:11px;border-radius:10px;cursor:pointer;color:#64748b;font-size:13px;font-weight:700}
.tb.a{background:linear-gradient(90deg, #3b82f6, #6366f1);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.4)}
input{width:100%;background:rgba(0,0,0,0.45);border:1px solid rgba(100,149,255,0.14);border-radius:14px;padding:14px;margin-bottom:12px;color:#fff}
button{width:100%;background:linear-gradient(90deg, #3b82f6, #6366f1);border:none;border-radius:14px;padding:14px;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(59,130,246,0.35)}
button.s2{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);box-shadow:none;margin-top:12px}
.hide{display:none}
.badge{display:inline-flex;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);padding:6px 12px;border-radius:20px;font-size:11px;color:#60a5fa;margin-bottom:14px}
</style></head><body>
<div class="grid"></div>

<div class="c" id="aBox">
<div class="badge">✨ AI-Powered Studio</div>
<img class="logo-img" src="logo.png" alt="Orbittroniz Logo">
<h1>Orbittroniz</h1>
<p class="s">Sign in to your AI creative universe</p>
<div class="t"><div class="tb" id="tL" onclick="M('login')">Login</div><div class="tb a" id="tS" onclick="M('signup')">Sign Up</div></div>
<input id="e" type="email" placeholder="Email">
<input id="p" type="password" placeholder="Password min 6 chars">
<button id="b" onclick="H()">Create Account →</button>
<div id="m" style="color:#86efac;font-size:13px;min-height:18px;margin-top:10px"></div>
</div>

<div class="c w hide" id="dBox" style="display:none">
<img class="logo-img" src="logo.png" style="width:72px;height:72px">
<h1 style="font-size:28px">Welcome 👋</h1>
<p class="s" id="ue"></p>
<p style="color:#86efac;margin:8px 0">✅ Login Successful!</p>
<p style="color:#64748b;font-size:13px;margin-bottom:10px">Your Orbittroniz workspace is ready. Premium tools coming soon.</p>
<button class="s2" onclick="logout()">Logout</button>
</div>

<script>
// YOUR EXACT WORKING LOGIN CODE - NOT CHANGED
let mode='signup';
function M(m){mode=m;document.getElementById('tL').className=m=='login'?'tb a':'tb';document.getElementById('tS').className=m=='signup'?'tb a':'tb';document.getElementById('b').innerText=m=='login'?'Login →':'Create Account →';}
function H(){let e=document.getElementById('e').value.trim(),p=document.getElementById('p').value,m=document.getElementById('m');if(!e.includes('@')||p.length<6){m.innerHTML='<span style=color:#fca5a5>Valid email + 6 char pass</span>';return}if(mode=='signup'){localStorage.setItem('oU',JSON.stringify({e,p}));m.innerText='✅ Account created!';setTimeout(()=>S(e),400)}else{let u=JSON.parse(localStorage.getItem('oU')||'null');if(u&&u.e==e&&u.p==p)S(e);else m.innerHTML='<span style=color:#fca5a5>Wrong pass or signup first</span>'}}
function S(email){document.getElementById('aBox').style.display='none';let d=document.getElementById('dBox');d.style.display='block';d.classList.remove('hide');document.getElementById('ue').innerText=email;localStorage.setItem('oL',email)}
function logout(){localStorage.removeItem('oL');location.reload()}
let L=localStorage.getItem('oL');if(L)S(L);
</script></body></html>
