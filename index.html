<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz - AI Tools</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#171717;border:1px solid #262626;border-radius:16px;padding:32px;width:100%;max-width:400px}
h1{font-size:24px;text-align:center;margin-bottom:8px} .sub{color:#888;text-align:center;font-size:14px;margin-bottom:24px}
input{width:100%;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:12px;color:#fff}
button{width:100%;background:#fff;color:#000;border:none;border-radius:8px;padding:12px;font-weight:600;cursor:pointer;margin-bottom:10px}
button.sec{background:#262626;color:#fff;border:1px solid #333}
.tabs{display:flex;gap:8px;margin-bottom:20px} .tab{flex:1;padding:10px;background:#262626;border-radius:8px;text-align:center;cursor:pointer;font-size:14px}
.tab.active{background:#fff;color:#000;font-weight:600}
#msg{text-align:center;font-size:13px;min-height:18px;margin-top:10px}
.success{color:#4ade80} .error{color:#f87171}
#dash{display:none;text-align:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tool{background:#262626;padding:16px;border-radius:12px;font-size:14px;border:1px solid #333}
</style>
</head>
<body>
<div class="card" id="auth">
<h1>Orbittroniz</h1>
<p class="sub">AI Image & Logo Generator</p>
<div class="tabs">
<div class="tab active" id="t1" onclick="m='login';setTab()">Login</div>
<div class="tab" id="t2" onclick="m='signup';setTab()">Sign Up</div>
</div>
<input id="email" type="email" placeholder="Email address">
<input id="pass" type="password" placeholder="Password (min 6 chars)">
<button id="btn" onclick="go()">Login</button>
<button class="sec" onclick="google()">Continue with Google</button>
<div id="msg"></div>
</div>

<div class="card" id="dash">
<h1>Welcome 👋</h1>
<p class="sub" id="uemail"></p>
<div class="tools">
<div class="tool">🎨<br>Image Gen</div>
<div class="tool">✏️<br>Logo Maker</div>
<div class="tool">🤖<br>AI Tools</div>
<div class="tool">📊<br>Dashboard</div>
</div>
<button class="sec" style="margin-top:24px" onclick="logout()">Logout</button>
</div>

<script>
// === PASTE YOUR KEYS HERE ===
const URL = 'https://vpzcsdjkeovtbgmbgwzz.supabase.co';
const KEY = 'PASTE_YOUR_ANON_KEY_HERE'; // <-- REPLACE THIS with eyJ... key
// ============================

const supa = window.supabase.createClient(URL, KEY);
let m='login';
function setTab(){
document.getElementById('t1').className=m=='login'?'tab active':'tab';
document.getElementById('t2').className=m=='signup'?'tab active':'tab';
document.getElementById('btn').innerText=m=='login'?'Login':'Create Account';
}
async function go(){
const email=document.getElementById('email').value.trim();
const pw=document.getElementById('pass').value;
const msg=document.getElementById('msg');
if(!email||!pw){msg.innerHTML='<span class=error>Fill email & password</span>';return}
msg.innerHTML='Loading...';
try{
let r; if(m=='login') r=await supa.auth.signInWithPassword({email,password:pw});
else r=await supa.auth.signUp({email,password:pw});
if(r.error) throw r.error;
if(m=='signup' && !r.data.session){msg.innerHTML='<span class=success>Check email to confirm! Then login.</span>'}
else show(r.data.user||r.data.session.user);
}catch(e){msg.innerHTML='<span class=error>'+e.message+'</span>'}
}
async function google(){await supa.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}})}
async function check(){const {data}=await supa.auth.getSession(); if(data.session) show(data.session.user)}
function show(u){document.getElementById('auth').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('uemail').innerText=u.email}
async function logout(){await supa.auth.signOut();location.reload()}
check();
</script>
</body>
</html>
