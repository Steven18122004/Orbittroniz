<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbittroniz</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:16px}.c{background:rgba(255,255,255,.09);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:26px;width:100%;max-width:900px;text-align:center}.c.auth{max-width:420px}h1{font-size:30px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.s{color:#cbd5e1;font-size:14px;margin:8px 0 18px}.t{display:flex;gap:6px;background:rgba(0,0,0,.35);padding:5px;border-radius:12px;margin-bottom:18px}.tb{flex:1;padding:10px;border-radius:10px;cursor:pointer;color:#94a3b8;font-size:13px}.tb.a{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;font-weight:700}input,textarea,select{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px;margin-bottom:11px;color:#fff;text-align:left}button{width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border:none;border-radius:12px;padding:13px;color:#fff;font-weight:700;cursor:pointer}button.s2{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);margin-top:10px}#m{color:#86efac;font-size:13px;margin-top:10px;min-height:18px}.box{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-top:12px;text-align:left}.rimg{width:100%;border-radius:10px;margin-top:10px;background:rgba(0,0,0,.3)}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body>

<!-- SAME AUTH CODE - NOT CHANGED -->
<div class="c auth" id="aBox"><h1>Orbittroniz</h1><p class="s">AI Image & Logo Generator</p><div class="t"><div class="tb" id="tL" onclick="M('login')">Login</div><div class="tb a" id="tS" onclick="M('signup')">Sign Up</div></div><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password min 6 chars"><button id="b" onclick="H()">Create Account</button><div id="m"></div></div>

<!-- WELCOME + TOOLS ADDED HERE ONLY -->
<div class="c hide" id="dBox"><h2 style="color:#fff">Welcome 👋</h2><p class="s" id="ue"></p><p style="color:#86efac;margin:8px 0">✅ Login Successful!</p>

<!-- TOOL TABS -->
<div class="t" style="margin-top:16px"><div class="tb a" id="bt1" onclick="openT('img')">🎨 Image</div><div class="tb" id="bt2" onclick="openT('logo')">✏️ Logo</div><div class="tb" id="bt3" onclick="openT('3d')">🧊 3D</div><div class="tb" id="bt4" onclick="openT('voice')">🎙️ Voice</div></div>

<div id="t-img" class="box"><b>AI Image Generator</b><textarea id="pImg" rows="2" placeholder="e.g. Futuristic city, cyberpunk, 4k"></textarea><div class="grid"><select id="sImg"><option>Realistic</option><option>Anime</option><option>3D Render</option><option>Cyberpunk</option></select><select id="rImg"><option value="1024x1024">Square</option><option value="1280x720">Wide</option><option value="720x1280">Portrait</option></select></div><button onclick="gImg()">Generate ✨</button><div id="rImgD"></div></div>

<div id="t-logo" class="box hide"><b>AI Logo Maker</b><input id="lName" placeholder="Brand name: Orbittroniz"><input id="lStyle" placeholder="Style: minimal rocket blue"><button onclick="gLogo()">Generate Logo ✨</button><div id="rLogo"></div></div>

<div id="t-3d" class="box hide"><b>3D Text Generator</b><input id="t3d" placeholder="Text: ORBITTRONIZ" value="ORBITTRONIZ"><div class="grid"><select id="c3d"><option value="#60a5fa">Blue</option><option value="#a78bfa">Purple</option><option value="#f472b6">Pink</option><option value="#f59e0b">Gold</option></select><select id="s3d"><option>3D Extrude</option><option>Neon</option></select></div><button onclick="g3d()">Generate 3D ✨</button><div style="height:140px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);border-radius:10px;margin-top:10px;perspective:500px"><div id="t3dOut" style="font-size:28px;font-weight:900;transform:rotateY(-20deg) rotateX(10deg);text-shadow:0 1px 0 #ccc,0 2px 0 #c9c9c9,0 3px 0 #bbb,0 6px 10px rgba(0,0,0,.4)">ORBITTRONIZ</div></div></div>

<div id="t-voice" class="box hide"><b>AI Voice Generator</b><textarea id="vT" rows="2" placeholder="Type text to speak..."></textarea><div class="grid"><select id="vSel"></select><select id="vSp"><option value="1">Normal</option><option value="0.8">Slow</option><option value="1.2">Fast</option></select></div><button onclick="gVoice()">Speak 🎙️</button><button class="s2" onclick="speechSynthesis.cancel()">Stop</button></div>

<button class="s2" onclick="logout()">Logout</button>
</div>

<script>
// === YOUR SAME LOGIN CODE - UNTOUCHED ===
let mode='signup';
function M(m){mode=m;document.getElementById('tL').className=m=='login'?'tb a':'tb';document.getElementById('tS').className=m=='signup'?'tb a':'tb';document.getElementById('b').innerText=m=='login'?'Login':'Create Account';}
function H(){let e=document.getElementById('e').value.trim(),p=document.getElementById('p').value,m=document.getElementById('m');if(!e.includes('@')||p.length<6){m.innerHTML='<span style=color:#fca5a5>Enter valid email & 6+ char pass</span>';return}if(mode=='signup'){localStorage.setItem('oU',JSON.stringify({e,p}));m.innerText='✅ Account created!';setTimeout(()=>S(e),500)}else{let u=JSON.parse(localStorage.getItem('oU')||'null');if(u&&u.e==e&&u.p==p)S(e);else m.innerHTML='<span style=color:#fca5a5>Wrong password or signup first</span>'}}
function S(email){document.getElementById('aBox').style.display='none';document.getElementById('dBox').style.display='block';document.getElementById('ue').innerText=email;localStorage.setItem('oL',email)}
function logout(){localStorage.removeItem('oL');location.reload()}
let L=localStorage.getItem('oL');if(L)S(L);

// === ONLY NEW TOOLS CODE BELOW ===
function openT(n){
 document.getElementById('t-img').classList.add('hide');
 document.getElementById('t-logo').classList.add('hide');
 document.getElementById('t-3d').classList.add('hide');
 document.getElementById('t-voice').classList.add('hide');
 document.getElementById('t-'+n).classList.remove('hide');
 document.getElementById('bt1').classList.remove('a');
 document.getElementById('bt2').classList.remove('a');
 document.getElementById('bt3').classList.remove('a');
 document.getElementById('bt4').classList.remove('a');
 let map={img:'bt1',logo:'bt2','3d':'bt3',voice:'bt4'}; document.getElementById(map[n]).classList.add('a');
}
function gImg(){
 let pr=document.getElementById('pImg').value||'beautiful', st=document.getElementById('sImg').value, ra=document.getElementById('rImg').value, wh=ra.split('x'), url='https://image.pollinations.ai/p/'+encodeURIComponent(pr+', '+st+', ultra detailed 8k')+'?width='+wh[0]+'&height='+wh[1]+'&seed='+Math.floor(Math.random()*99999)+'&nologo=1';
 document.getElementById('rImgD').innerHTML='<p class=s>⏳ Generating...</p><img class=rimg src="'+url+'" onload="this.previousElementSibling.innerHTML=\'✅ Done\'">';
}
function gLogo(){
 let n=document.getElementById('lName').value||'Orbittroniz', s=document.getElementById('lStyle').value||'minimal modern', url='https://image.pollinations.ai/p/'+encodeURIComponent('logo for '+n+', '+s+', vector professional white background')+'?width=1024&height=1024&seed='+Math.floor(Math.random()*99999)+'&nologo=1';
 document.getElementById('rLogo').innerHTML='<p class=s>⏳ Generating...</p><img class=rimg src="'+url+'" style="background:#fff;padding:10px">';
}
function g3d(){let t=document.getElementById('t3d').value||'ORBITTRONIZ', c=document.getElementById('c3d').value; let el=document.getElementById('t3dOut'); el.innerText=t; el.style.color=c;}
function loadV(){let s=document.getElementById('vSel'), vs=speechSynthesis.getVoices(); s.innerHTML=''; vs.forEach(function(v,i){let o=document.createElement('option');o.value=i;o.text=v.name; s.appendChild(o)});}
speechSynthesis.onvoiceschanged=loadV; loadV();
function gVoice(){let t=document.getElementById('vT').value||'Welcome to Orbittroniz', sp=parseFloat(document.getElementById('vSp').value), vs=speechSynthesis.getVoices(), idx=document.getElementById('vSel').value, u=new SpeechSynthesisUtterance(t); if(vs[idx])u.voice=vs[idx]; u.rate=sp; speechSynthesis.cancel(); speechSynthesis.speak(u);}
</script></body></html>
