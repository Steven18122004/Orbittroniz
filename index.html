<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbittroniz - AI Image & Logo Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,0.3)}
h1{font-size:28px;text-align:center;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.sub{color:#cbd5e1;text-align:center;font-size:14px;margin:8px 0 24px}
.tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(0,0,0,0.2);padding:4px;border-radius:12px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;color:#94a3b8;font-size:14px;transition:0.2s}
.tab.active{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;font-weight:600}
input{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:14px;margin-bottom:12px;color:#fff;outline:none}
input:focus{border-color:#60a5fa}
button{width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:10px;padding:14px;font-weight:600;cursor:pointer;margin-bottom:10px;transition:0.2s}
button:hover{opacity:0.9;transform:translateY(-1px)}
button.sec{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15)}
#msg{text-align:center;font-size:13px;min-height:18px;margin-top:8px}
.error{color:#fca5a5} .success{color:#86efac}
#dash{display:none;text-align:center}
#dash h2{color:#fff;font-size:22px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tool{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);padding:18px;border-radius:14px;color:#e2e8f0;font-size:14px}
</style>
</head>
<body>
<div class="card" id="auth">
<h1>Orbittroniz</h1>
<p class="sub">AI Image & Logo Generator</p>
<div class="tabs">
<div class="tab active" id="t1" onclick="switchM('login')">Login</div>
<div class="tab" id="t2" onclick="switchM('signup')">Sign Up</div>
</div>
<input id="email" type="email" placeholder="Email address">
<input id="pass" type="password" placeholder="Password (min 6 chars)">
<button id="btn" onclick="go()">Login</button>
<button class="sec" onclick="gLogin()">Continue with Google</button>
<div id="msg"></div>
</div>

<div class="card" id="dash">
<h2>Welcome 👋</h2>
<p class="sub" id="uemail"></p>
<div class="tools">
<div class="tool">🎨 Image Generator</div>
<div class="tool">✏️ Logo Maker</div>
<div class="tool">🤖 AI Tools</div>
<div class="tool">⚡ Dashboard</div>
</div>
<button class="sec" style="margin-top:24px" onclick="logout()">Logout</button>
</div>

<script>
const SUPA_URL = 'https://vpzcsdjkeovtbgmbgwzz.supabase.co';
const SUPA_KEY = 'PASTE_KEY_HERE'; // <-- PASTE YOUR eyJ... ANON KEY HERE

const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
let mode='login';
function switchM(m){mode=m;document.getElementById('t1').className=m=='login'?'tab active':'tab';document.getElementById('t2').className=m=='signup'?'tab active':'tab';document.getElementById('btn').innerText=m=='login'?'Login':'Create Account'}
async function go(){
const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value,mbox=document.getElementById('msg');
if(!e||!p){mbox.innerHTML='<span class=error>Enter email & password</span>';return}
if(SUPA_KEY.includes('PASTE')){mbox.innerHTML='<span class=error>You forgot to paste anon key in code!</span>';return}
mbox.innerHTML='Loading...';
try{let r=mode=='login'?await supa.auth.signInWithPassword({email:e,password:p}):await supa.auth.signUp({email:e,password:p}); if(r.error) throw r.error; if(mode=='signup'&&!r.data.session){mbox.innerHTML='<span class=success>Check email to confirm, then Login</span>'}else show(r.data.user||r.data.session.user)}catch(err){mbox.innerHTML='<span class=error>'+err.message+'</span>'}
}
async function gLogin(){await supa.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}})}
async function check(){const {data}=await supa.auth.getSession(); if(data.session) show(data.session.user)}
function show(u){document.getElementById('auth').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('uemail').innerText=u.email}
async function logout(){await supa.auth.signOut();location.reload()}
check();
</script>
</body>
</html>
