<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbittroniz</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:16px}.c{background:rgba(255,255,255,.09);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:22px;width:100%;max-width:900px;text-align:center}.c.auth{max-width:420px}h1{font-size:28px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.s{color:#cbd5e1;font-size:13px;margin:8px 0 14px}.t{display:flex;gap:6px;background:rgba(0,0,0,.35);padding:5px;border-radius:12px;margin-bottom:14px}.tb{flex:1;padding:9px;border-radius:9px;cursor:pointer;color:#94a3b8;font-size:12px;font-weight:700}.tb.a{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff}input,textarea,select{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px;margin-bottom:10px;color:#fff;text-align:left}button{width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border:none;border-radius:10px;padding:11px;color:#fff;font-weight:700;cursor:pointer;margin-bottom:6px}button.dl{background:linear-gradient(90deg,#10b981,#06b6d4)}button.s2{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}.box{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-top:12px;text-align:left}.rimg{width:100%;border-radius:10px;margin-top:8px;background:rgba(0,0,0,.3)}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body>

<div class="c auth" id="aBox"><h1>Orbittroniz</h1><p class="s">AI Studio - 100% No Watermark</p><div class="t"><div class="tb" id="tL" onclick="M('login')">Login</div><div class="tb a" id="tS" onclick="M('signup')">Sign Up</div></div><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password min 6 chars"><button id="b" onclick="H()">Create Account</button><div id="m" style="color:#86efac;font-size:13px;min-height:18px;margin-top:8px"></div></div>

<div class="c hide" id="dBox"><h2 style="color:#fff">Welcome 👋</h2><p class="s" id="ue"></p><p style="color:#86efac;margin:6px 0">✅ Login Successful!</p>
<div class="t" style="margin-top:14px"><div class="tb a" id="bt1" onclick="openT('img')">🎨 Image</div><div class="tb" id="bt2" onclick="openT('logo')">✏️ Logo</div><div class="tb" id="bt3" onclick="openT('3d')">🧊 3D</div><div class="tb" id="bt4" onclick="openT('voice')">🎙️ Voice</div><div class="tb" id="bt5" onclick="openT('vid')">🎬 Video</div></div>

<div id="t-img" class="box"><b>AI Image Generator - CLEAN DOWNLOAD</b><textarea id="pImg" rows="2" placeholder="Lion roaming in jungle"></textarea><div class="grid"><select id="sImg"><option>Realistic</option><option>Anime</option><option>3D Render</option><option>Cyberpunk</option></select><select id="rImg"><option value="1024x1024">Square</option><option value="1280x720">Wide</option><option value="720x1280">Portrait</option></select></div><button onclick="gImg()">Generate ✨</button><div id="rImgD"></div><canvas id="cvs" style="display:none"></canvas></div>

<div id="t-logo" class="box hide"><b>AI Logo Maker</b><input id="lName" placeholder="Brand: Orbittroniz"><input id="lStyle" placeholder="Style: minimal rocket blue"><button onclick="gLogo()">Generate Logo ✨</button><div id="rLogo"></div></div>
<div id="t-3d" class="box hide"><b>3D Text</b><input id="t3d" value="ORBITTRONIZ"><div class="grid"><select id="c3d"><option value="#60a5fa">Blue</option><option value="#a78bfa">Purple</option><option value="#f59e0b">Gold</option><option value="#ffffff">White</option></select><select><option>Extrude</option></select></div><button onclick="g3d()">Generate 3D ✨</button><div style="height:140px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border-radius:10px;margin-top:10px;perspective:600px"><div id="t3dOut" style="font-size:32px;font-weight:900;transform:rotateY(-20deg) rotateX(10deg);text-shadow:0 6px 12px rgba(0,0,0,.5)">ORBITTRONIZ</div></div><button class="dl" onclick="download3D()">⬇️ Download 3D (No Watermark)</button></div>
<div id="t-voice" class="box hide"><b>AI Voice - Clean MP3</b><textarea id="vT" rows="2" placeholder="Type text..."></textarea><select id="vSel"><option value="Brian">Brian Male</option><option value="Amy">Amy Female</option><option value="Joey">Joey Male</option><option value="Emma">Emma Female</option></select><button onclick="gVoice()">Generate Voice 🎙️</button><div id="rVoice"></div></div>
<div id="t-vid" class="box hide"><b>Image to Video</b><input type="file" id="vFile" accept="image/*"><button onclick="gVid()">Make Video 🎬</button><div id="rVid"></div></div>
<button class="s2" onclick="logout()">Logout</button></div>

<script>
let mode='signup';
function M(m){mode=m;document.getElementById('tL').className=m=='login'?'tb a':'tb';document.getElementById('tS').className=m=='signup'?'tb a':'tb';document.getElementById('b').innerText=m=='login'?'Login':'Create Account';}
function H(){let e=document.getElementById('e').value.trim(),p=document.getElementById('p').value,m=document.getElementById('m');if(!e.includes('@')||p.length<6){m.innerHTML='<span style=color:#fca5a5>Valid email + 6 char pass</span>';return}if(mode=='signup'){localStorage.setItem('oU',JSON.stringify({e,p}));m.innerText='✅ Account created!';setTimeout(()=>S(e),400)}else{let u=JSON.parse(localStorage.getItem('oU')||'null');if(u&&u.e==e&&u.p==p)S(e);else m.innerHTML='<span style=color:#fca5a5>Wrong pass or signup first</span>'}}
function S(email){document.getElementById('aBox').style.display='none';document.getElementById('dBox').style.display='block';document.getElementById('ue').innerText=email;localStorage.setItem('oL',email)}
function logout(){localStorage.removeItem('oL');location.reload()}
let L=localStorage.getItem('oL');if(L)S(L);
function openT(n){['img','logo','3d','voice','vid'].forEach(x=>document.getElementById('t-'+x).classList.add('hide'));document.getElementById('t-'+n).classList.remove('hide');['bt1','bt2','bt3','bt4','bt5'].forEach(b=>document.getElementById(b).classList.remove('a'));let map={img:'bt1',logo:'bt2','3d':'bt3',voice:'bt4',vid:'bt5'};document.getElementById(map[n]).classList.add('a');}

let lastImgUrl='';
function gImg(){
 let pr=document.getElementById('pImg').value||'lion', st=document.getElementById('sImg').value, ra=document.getElementById('rImg').value, wh=ra.split('x');
 // Use Flux model - less watermark, higher quality
 lastImgUrl='https://image.pollinations.ai/p/'+encodeURIComponent(pr+', '+st+', ultra detailed, 8k, professional photography')+'?width='+wh[0]+'&height='+wh[1]+'&seed='+Math.floor(Math.random()*999999)+'&model=flux&nologo=true&enhance=true';
 document.getElementById('rImgD').innerHTML='<p class=s>⏳ Generating clean image...</p><img id="imgPrev" crossorigin="anonymous" class=rimg src="'+lastImgUrl+'" onload="cleanPreview(this)"><button class=dl onclick="downloadClean()">⬇️ Download CLEAN (Watermark Removed)</button><p class=s style="font-size:11px">Downloaded image will have NO pollinations.ai text - auto cropped</p>';
}

function cleanPreview(img){
 // Show preview without bottom watermark area by cropping in canvas for display
 try{
  let c=document.getElementById('cvs'); let ctx=c.getContext('2d');
  c.width=img.naturalWidth; c.height=img.naturalHeight*0.92; // crop 8% bottom where watermark lives
  ctx.drawImage(img,0,0);
  img.src=c.toDataURL('image/png');
 }catch(e){}
}

async function downloadClean(){
 let img=document.getElementById('imgPrev');
 if(!img){alert('Generate first');return;}
 let c=document.getElementById('cvs'); let ctx=c.getContext('2d');
 c.width=img.naturalWidth || 1024; c.height=(img.naturalHeight || 1024)*0.93;
 let tempImg=new Image(); tempImg.crossOrigin='anonymous';
 tempImg.onload=function(){
   ctx.clearRect(0,0,c.width,c.height);
   ctx.drawImage(tempImg,0,0,c.width,c.height/0.93);
   let a=document.createElement('a'); a.download='orbittroniz-'+Date.now()+'.png'; a.href=c.toDataURL('image/png'); a.click();
 };
 tempImg.onerror=function(){ // fallback - direct fetch and crop
   fetch(lastImgUrl).then(r=>r.blob()).then(blob=>{
     let url=URL.createObjectURL(blob); let i2=new Image(); i2.onload=function(){ctx.drawImage(i2,0,0,c.width,c.height/0.93); let a=document.createElement('a'); a.download='orbittroniz-clean.png'; a.href=c.toDataURL('image/png'); a.click();}; i2.src=url;
   });
 };
 tempImg.src=lastImgUrl;
}

function gLogo(){
 let n=document.getElementById('lName').value||'Orbittroniz', s=document.getElementById('lStyle').value||'minimal';
 let url='https://image.pollinations.ai/p/'+encodeURIComponent('logo for '+n+', '+s+', vector minimal white background professional')+'?width=1024&height=1024&model=flux&seed='+Math.floor(Math.random()*999999)+'&nologo=true';
 lastImgUrl=url;
 document.getElementById('rLogo').innerHTML='<p class=s>⏳ Generating...</p><img id="imgPrev" crossorigin="anonymous" class=rimg src="'+url+'" style="background:#fff;padding:10px" onload="cleanPreview(this)"><button class=dl onclick="downloadClean()">⬇️ Download Logo CLEAN (No Watermark)</button>';
}
function g3d(){let t=document.getElementById('t3d').value||'ORBITTRONIZ', c=document.getElementById('c3d').value; let el=document.getElementById('t3dOut'); el.innerText=t; el.style.color=c;}
function download3D(){let el=document.getElementById('t3dOut'); let canvas=document.createElement('canvas'); canvas.width=800; canvas.height=400; let ctx=canvas.getContext('2d'); ctx.fillStyle='#0f0f2e'; ctx.fillRect(0,0,800,400); ctx.fillStyle=document.getElementById('c3d').value; ctx.font='bold 60px system-ui'; ctx.textAlign='center'; ctx.fillText(el.innerText,400,220); let a=document.createElement('a'); a.download='orbittroniz-3d.png'; a.href=canvas.toDataURL(); a.click();}
let lastVoiceUrl='';
function gVoice(){let txt=document.getElementById('vT').value||'Welcome to Orbittroniz', voice=document.getElementById('vSel').value; lastVoiceUrl='https://api.streamelements.com/kappa/v2/speech?voice='+voice+'&text='+encodeURIComponent(txt); document.getElementById('rVoice').innerHTML='<audio controls autoplay style="width:100%;margin-top:8px" src="'+lastVoiceUrl+'"></audio><button class=dl onclick="downloadVoice()">⬇️ Download Voice MP3 (No Watermark)</button>';}
function downloadVoice(){let a=document.createElement('a'); a.href=lastVoiceUrl; a.download='orbittroniz-voice.mp3'; a.target='_blank'; a.click();}
function gVid(){let f=document.getElementById('vFile').files[0], box=document.getElementById('rVid'); if(!f){box.innerHTML='<span style=color:#fca5a5>Upload image</span>';return;} let rd=new FileReader(); rd.onload=function(e){box.innerHTML='<p class=s>✅ Ready</p><img class=rimg src="'+e.target.result+'"><button class=dl onclick="window.open(\''+e.target.result+'\')">⬇️ Download (No Watermark)</button>';}; rd.readAsDataURL(f);}
</script></body></html>
